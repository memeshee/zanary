# ZANARY's own privacy gate.
#
# Five jobs, and the pair in the middle is the point: the same rig, the same property library, one flow
# that must pass and one that must be caught. A gate that only ever says "green" proves nothing, so the
# control flow's leaks are a test result too — read its job summary for the four FAIL lines.
#
#   tests    — fmt (clean), clippy (warnings denied), the unit suite: the library under the rig
#   private  — a clean flow, which must PASS (a leak fails this build)
#   control  — a deliberately leaky flow, which must be CAUGHT (a silent detector fails this build)
#   payer    — the bounded payer's ledger must show the refusals the grant implies
#   publish  — the claim index and the two-minute demo, served from the repository's own Pages
#
# A red job means the rig or the library misbehaved, and the job summary says which.
name: privacy gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # A claim is a subscription, not a fact: re-prove weekly or it goes stale (docs/CLAIMS.md).
    - cron: "17 4 * * 1"

concurrency:
  group: privacy-gate-${{ github.ref }}
  # A push and a scheduled re-probe are different pieces of evidence; neither cancels the other.
  cancel-in-progress: false

permissions:
  contents: read

jobs:

  # The suite and the hygiene checks, first because they are the cheapest signal: 67 unit tests
  # (including the fixtures that prove "clean passes everything, leaky fails everything" and the golden
  # reports that pin the recorded evidence), plus fmt and clippy with warnings denied. The gate jobs
  # below prove the rig works on a real chain; this job proves the library underneath it still behaves.
  tests:
    name: tests — fmt, clippy, the unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain (as pinned by rust-toolchain.toml)
        shell: bash
        run: |
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | head -1)"
          rustup toolchain install "${CHANNEL:-stable}" --profile minimal --no-self-update
          rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: formatting
        run: cargo fmt --all --check

      - name: lints (warnings are errors here, unlike a local run)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: the unit suite
        run: cargo test --workspace

  gate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      # Both halves of the pair always run: a red private flow must not hide the control's verdict.
      fail-fast: false
      matrix:
        include:
          - name: private flow — a leak fails this build
            id: private
            flow: flows/ci-checkout.json
            expect: pass
          - name: control flow — the property library must catch it
            id: control
            flow: flows/ci-checkout-control.json
            expect: fail

    steps:
      - uses: actions/checkout@v4

      # The gate is the repository's own action, exercised here on every push: the rig and the
      # property library come from the action's checkout, the flow definition from this workspace.
      - uses: ./
        with:
          flow: ${{ matrix.flow }}
          expect: ${{ matrix.expect }}
          anchor: "true"
          ttl-days: "30"
          out: runs/${{ matrix.id }}

      - name: upload the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zanary-${{ matrix.id }}-evidence
          path: runs/${{ matrix.id }}/
          # run.json + findings.json + report.json + anchor.json + test.json + the gate log: what a
          # reviewer needs to re-derive every line of the summary without trusting this job.
          retention-days: 30
          if-no-files-found: warn

  # The claims the two gate jobs just made, rendered as the public index: "a privacy claim is not a
  # fact, it is a subscription". Published from main (a pull request's claims are not published, a
  # scheduled re-probe is), together with the recorded claims in `crates/report/fixtures/reports/` —
  # those are history, and a claim that has expired is still evidence.
  publish:
    name: publish the claim index
    needs: gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain
        shell: bash
        run: |
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | head -1)"
          rustup toolchain install "${CHANNEL:-stable}" --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: build the report tool
        run: cargo build --release --bin zanary-report

      - name: collect this run's claims
        uses: actions/download-artifact@v4
        with:
          pattern: zanary-*-evidence
          path: claim-input

      - name: add the recorded claims (history)
        run: |
          # The recorded claims in this repository are flat report files, which is exactly the other
          # layout `zanary-report index` reads (run directories for this run's claims, flat files for
          # history). A claim that has expired is still evidence, so it stays on the page.
          cp crates/report/fixtures/reports/*.json claim-input/
          ls claim-input

      - name: render the index
        run: |
          mkdir -p public/claims
          # `--claims-prefix claims` is where the links on the page point: the loop below copies the
          # claims to exactly that path, so every card's link opens the file it was rendered from.
          ./target/release/zanary-report index --reports claim-input --out public/index.html \
            --claims-prefix claims
          # The claims themselves stay fetchable next to the page, in the run-directory layout the
          # index reads: a reader can download one and run `zanary-report verify` on it instead of
          # trusting a rendering of it.
          for dir in claim-input/*/; do
            name="$(basename "$dir")"
            mkdir -p "public/claims/$name"
            cp "$dir"report.json "$dir"anchor.json "$dir"test.json "public/claims/$name/" 2>/dev/null || true
          done
          cp claim-input/*.json public/claims/ 2>/dev/null || true
          find public -type f | sort | head -20

      - name: publish the two-minute demo next to the claims
        run: |
          # The submission field asks for a *video URL*, so the artifact is served from here rather than
          # from a third-party upload: same origin as the claims it shows, no account in the loop. The
          # recording pipeline itself stays out of the repository (docs/VIDEO-SCRIPT.md).
          mkdir -p public/video
          cp video/*.mp4 public/video/ 2>/dev/null || echo "no video in the tree — skipping"
          cat > public/video/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>ZANARY — the two-minute demo</title>
          <style>
            :root { color-scheme: dark; }
            body { margin: 0; background: #020617; color: #c8d4e3;
                   font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
            main { max-width: 1100px; margin: 0 auto; padding: 32px 20px 64px; }
            h1 { font-size: 22px; margin: 0 0 4px; }
            p.sub { color: #8fa0b4; margin: 0 0 24px; }
            video { width: 100%; height: auto; border: 1px solid #1e293b; border-radius: 8px; background: #000; }
            a { color: #22d3ee; }
            ul { color: #8fa0b4; }
          </style></head>
          <body><main>
            <h1>ZANARY — the two-minute demo</h1>
            <p class="sub">a privacy claim is not a fact, it is a subscription · ZECATHON · Core &amp; Tooling</p>
            <video controls preload="metadata" poster=""></video>
            <script>
              // one file, named by the workflow: no player library, no external host
              const v = document.querySelector('video');
              v.src = 'zanary-demo.mp4';
            </script>
            <p>What is on screen comes from a real run: the private flow passing, the control flow caught,
            the bounded payer's ledger refusing over-cap, off-allowlist and revoked invoices, and the
            published claims with their clocks. Every number in the narration is in the artifacts.</p>
            <ul>
              <li><a href="../">the claim index</a> — the claims themselves, with their expiry clocks</li>
              <li><a href="https://github.com/memeshee/zanary">the repository</a> · <a href="https://github.com/memeshee/zanary/blob/main/docs/VIDEO-SCRIPT.md">the cut sheet</a></li>
            </ul>
          </main></body></html>
          HTML
          find public -type f | sort | tail -5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: deploy
        id: deploy
        uses: actions/deploy-pages@v4

  # The acceptance test for the *subject*: a bounded payer given a budget instead of a key. Over-cap and
  # off-allowlist invoices must be refused, the refusals must be in the ledger, and a tripped kill
  # switch must stop everything — asserted from the ledger and the report, not from the payer's console.
  payer:
    name: bounded payer — the ledger must show the refusals
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: rust toolchain (as pinned by rust-toolchain.toml)
        shell: bash
        run: |
          CHANNEL="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml | head -1)"
          rustup toolchain install "${CHANNEL:-stable}" --profile minimal --no-self-update

      - uses: Swatinem/rust-cache@v2

      - name: build the rig
        run: cargo build --release --bin zanary-probe --bin zanary-report

      - name: start the throwaway chain
        run: harness/up.sh

      - name: the grant, four invoices, and the kill switch
        run: scripts/bounded-payer-demo.sh

      - name: upload the ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zanary-payer-evidence
          path: data/payer-demo/
          retention-days: 30
          if-no-files-found: warn