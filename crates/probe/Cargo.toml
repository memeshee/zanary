[package]
name = "zanary-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
# Two binaries live in this package (`zanary-probe`, `zanary-seed`), so plain
# `cargo run -p zanary-probe` needs the default spelled out — every command in the
# docs is written that way.
default-run = "zanary-probe"

[[bin]]
name = "zanary-probe"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
# The flow runner (`zanary-probe flow`) records a real run into the shared observation
# model and produces findings + a report in the same command.
zanary-observation = { path = "../observation" }
zanary-properties = { path = "../properties" }
zanary-report = { path = "../report" }
tracing.workspace = true
tracing-subscriber.workspace = true
zcash_client_backend.workspace = true
zcash_proofs.workspace = true
zcash_primitives.workspace = true
zip321.workspace = true
pczt.workspace = true
rusqlite.workspace = true
base64.workspace = true
tonic.workspace = true
zcash_client_sqlite.workspace = true
zcash_keys.workspace = true
zcash_protocol.workspace = true
zip32.workspace = true
rand.workspace = true
async-trait.workspace = true
bip39.workspace = true
zcash_transparent.workspace = true
orchard.workspace = true
pasta_curves.workspace = true
zcash_script.workspace = true
# `zanary-seed` (src/bin/zanary-seed.rs): Orchard-only shielding needs the Sapling prover
# traits to satisfy the wallet API (its Orchard proving key is built internally by
# zcash_primitives), and address parsing. All already in the dependency graph.
zcash_address = "0.13"
sapling-crypto = "0.7"
jubjub = "0.10"
bls12_381 = "0.8"
rand_core = "0.6"
