[workspace]
resolver = "2"
members = ["crates/probe"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.1"
description = "CANARY — an independent privacy prober for Zcash payment flows (ZECATHON, Core & Tooling)"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Zcash stack (versions verified live via crates.io on 2026-10-11)
zcash_client_backend = { version = "0.24", features = ["lightwalletd-tonic", "lightwalletd-tonic-transport", "sync"] }
zcash_proofs = "0.30"
zip321 = "0.9"
pczt = "0.9"
