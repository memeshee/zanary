# ZANARY regtest node — the throwaway chain the privacy rig runs against.
#
# `harness/up.sh` copies this file to `data/zcashd/.zcash/zcash.conf` on a fresh checkout
# and never overwrites an existing one (that file is live node state: its mining address and
# any local edits). `data/` is gitignored, so this template is what makes the rig one
# command for a stranger and for CI.
#
# Nothing here is a mainnet node: regtest=1, a throwaway datadir, and RPC creds that are
# published on purpose.

regtest=1
server=1
rpcuser=zanary
rpcpassword=zanary
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
txindex=1
experimentalfeatures=1
lightwalletd=1
fallbackfee=0.0001
printtoconsole=1
i-am-aware-zcashd-will-be-replaced-by-zebrad-and-zallet-in-2025=1

# Network upgrades at height 1. zcashd does NOT apply these on regtest by default, and without
# them the chain has no shielded pool to test (branch ids are zcashd v6.20.0's upgrades.cpp):
# Overwinter, Sapling, Blossom, Heartwood, Canopy, NU5/Orchard, NU6.
nuparams=5ba81b19:1
nuparams=76b809bb:1
nuparams=2bb40e60:1
nuparams=f5b9230b:1
nuparams=e9ff75a6:1
nuparams=c2d6d0b4:1
nuparams=c8e71055:1

# Mine straight to the rig's own wallet instead of the node's.
#
# The address is the ZANARY dev account's default external transparent receiver, derived from the
# public BIP-39 test-vector seed every clone of this repo uses — so the coinbase this node mines is
# spendable by the flow's payer wallet, with no faucet and no pre-seeding. `minetolocalwallet=0`
# permits an address the node wallet does not hold: the node stays the chain and the miner, nothing
# else. Delete both lines to mine to the node wallet again (then `zanary-probe fund` has something
# to send, and the flow falls back to that path).
mineraddress=tmF1xjfhsSzhy55dmhorzTnKjtHhZmPKzts
minetolocalwallet=0
