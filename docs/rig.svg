<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 950" width="1320" height="950" role="img" aria-label="ZANARY rig architecture">
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#141d2e" stroke-width="0.6"/>
  </pattern>
  <marker id="arrow-34d399" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/></marker><marker id="arrow-22d3ee" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/></marker><marker id="arrow-fbbf24" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fbbf24"/></marker><marker id="arrow-a78bfa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/></marker><marker id="arrow-fb7185" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb7185"/></marker><marker id="arrow-94a3b8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/></marker><marker id="arrow-fb923c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#fb923c"/></marker>
</defs>
<rect width="1320" height="950" fill="#020617"/>
<rect width="1320" height="950" fill="url(#grid)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'JetBrains Mono', monospace">
<text x="36" y="44" fill="#e6edf3" font-size="21" font-weight="700">ZANARY — the rig, end to end</text>
<text x="36" y="68" fill="#8fa0b4" font-size="12">a privacy claim is a test result: it runs on a throwaway chain, it is re-derived from that chain, and it expires unless it is re-proved</text>
<rect x="36" y="96" width="250" height="250" rx="12" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="48" y="88" fill="#64748b" font-size="11" letter-spacing="0.08em">OUTSIDE THE RIG</text>
<rect x="50" y="116" width="222" height="92" rx="7" fill="rgba(30, 41, 59, 0.50)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="64" y="140" fill="#e6edf3" font-size="13" font-weight="600">operator</text>
<text x="64" y="160" fill="#93a4b8" font-size="10">writes a grant:</text>
<text x="64" y="175" fill="#93a4b8" font-size="10">budget · per-payment cap ·</text>
<text x="64" y="190" fill="#93a4b8" font-size="10">allowlist · expiry · kill switch</text>
<rect x="50" y="226" width="222" height="96" rx="7" fill="rgba(30, 41, 59, 0.50)" stroke="#94a3b8" stroke-width="1.5"/>
<text x="64" y="250" fill="#e6edf3" font-size="13" font-weight="600">merchant</text>
<text x="64" y="270" fill="#93a4b8" font-size="10">issues a ZIP-321 invoice:</text>
<text x="64" y="285" fill="#93a4b8" font-size="10">fresh diversified Orchard</text>
<text x="64" y="300" fill="#93a4b8" font-size="10">receiver + ZIP-302 memo</text>
<rect x="320" y="96" width="250" height="250" rx="12" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="332" y="88" fill="#64748b" font-size="11" letter-spacing="0.08em">SUBJECTS UNDER TEST</text>
<rect x="334" y="116" width="222" height="78" rx="7" fill="rgba(6, 78, 59, 0.40)" stroke="#34d399" stroke-width="1.5"/>
<text x="348" y="140" fill="#e6edf3" font-size="13" font-weight="600">bounded payer</text>
<text x="348" y="160" fill="#93a4b8" font-size="10">zanary-probe payer</text>
<text x="348" y="175" fill="#93a4b8" font-size="10">one ledger line per decision</text>
<rect x="334" y="206" width="222" height="116" rx="7" fill="rgba(6, 78, 59, 0.40)" stroke="#34d399" stroke-width="1.5"/>
<text x="348" y="230" fill="#e6edf3" font-size="13" font-weight="600">flow runner</text>
<text x="348" y="250" fill="#93a4b8" font-size="10">zanary-probe flow / test</text>
<text x="348" y="265" fill="#93a4b8" font-size="10">flows/*.json  ·  N invoices</text>
<text x="348" y="280" fill="#93a4b8" font-size="10">fresh receiver + memo each</text>
<rect x="604" y="96" width="250" height="250" rx="12" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="616" y="88" fill="#64748b" font-size="11" letter-spacing="0.08em">OUR WALLET LAYER</text>
<rect x="618" y="116" width="222" height="210" rx="7" fill="rgba(8, 51, 68, 0.40)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="632" y="140" fill="#e6edf3" font-size="13" font-weight="600">librustzcash wallet</text>
<text x="632" y="160" fill="#93a4b8" font-size="10">create · sync · derive</text>
<text x="632" y="175" fill="#93a4b8" font-size="10">fresh diversified receiver</text>
<text x="632" y="190" fill="#93a4b8" font-size="10">propose (ZIP-317 fee)</text>
<text x="632" y="205" fill="#93a4b8" font-size="10">PCZT → sign → broadcast</text>
<text x="632" y="220" fill="#93a4b8" font-size="10">trial-decrypt to verify</text>
<text x="632" y="235" fill="#93a4b8" font-size="10"></text>
<text x="632" y="250" fill="#93a4b8" font-size="10">the rig drives wallets here,</text>
<text x="632" y="265" fill="#93a4b8" font-size="10">never through node conventions</text>
<rect x="888" y="96" width="396" height="250" rx="12" fill="none" stroke="#64748b" stroke-width="1.2" stroke-dasharray="7,5"/>
<text x="900" y="88" fill="#64748b" font-size="11" letter-spacing="0.08em">HARNESS — A CHAIN, THROWN AWAY AFTER EVERY RUN</text>
<rect x="902" y="116" width="176" height="100" rx="7" fill="rgba(120, 53, 15, 0.30)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="916" y="140" fill="#e6edf3" font-size="13" font-weight="600">zcashd</text>
<text x="916" y="160" fill="#93a4b8" font-size="10">regtest · v6.20.0</text>
<text x="916" y="175" fill="#93a4b8" font-size="10">NU5/NU6 active</text>
<text x="916" y="190" fill="#93a4b8" font-size="10">chain + miner</text>
<rect x="1094" y="116" width="176" height="100" rx="7" fill="rgba(120, 53, 15, 0.30)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="1108" y="140" fill="#e6edf3" font-size="13" font-weight="600">lightwalletd</text>
<text x="1108" y="160" fill="#93a4b8" font-size="10">v0.5.5 · gRPC :9067</text>
<text x="1108" y="175" fill="#93a4b8" font-size="10">compact blocks</text>
<text x="1108" y="190" fill="#93a4b8" font-size="10">tip must match node</text>
<rect x="902" y="236" width="368" height="100" rx="7" fill="rgba(120, 53, 15, 0.30)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="916" y="260" fill="#e6edf3" font-size="13" font-weight="600">instant blocks, on demand</text>
<text x="916" y="280" fill="#93a4b8" font-size="10">the rig decides when a block exists —</text>
<text x="916" y="295" fill="#93a4b8" font-size="10">no network, no faucet, no waiting</text>
<text x="916" y="310" fill="#93a4b8" font-size="10">coinbase pays the payer&#x27;s own receiver,</text>
<text x="916" y="325" fill="#93a4b8" font-size="10">never the node wallet&#x27;s  ·  ~140 blocks in 2s</text>
<rect x="36" y="396" width="396" height="116" rx="7" fill="rgba(76, 29, 149, 0.40)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="50" y="420" fill="#e6edf3" font-size="14" font-weight="600">FlowRun — what the rig saw</text>
<text x="50" y="440" fill="#93a4b8" font-size="10">payments (txid, height, receivers, memo)</text>
<text x="50" y="455" fill="#93a4b8" font-size="10">funding (transparent outputs that backed them)</text>
<text x="50" y="470" fill="#93a4b8" font-size="10">merchant events · pool totals · receipts</text>
<text x="50" y="485" fill="#93a4b8" font-size="10">payer: the grant + one decision per invoice</text>
<path d="M 449 340 C 430 380, 330 392, 236 392" fill="none" stroke="#94a3b8" stroke-width="1.4" marker-end="url(#arrow-94a3b8)"/>
<text x="372" y="372" fill="#8fa0b4" font-size="10" text-anchor="middle">observes</text>
<rect x="468" y="396" width="396" height="116" rx="7" fill="rgba(76, 29, 149, 0.40)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="482" y="420" fill="#e6edf3" font-size="14" font-weight="600">property library — 13 leak classes</text>
<text x="482" y="440" fill="#93a4b8" font-size="10">5 disqualifying chain-visible + payer-policy</text>
<text x="482" y="455" fill="#93a4b8" font-size="10">6 warnings · 1 note · each a pure function</text>
<text x="482" y="470" fill="#93a4b8" font-size="10">a clean run passes everything; a leaky run fails</text>
<text x="482" y="485" fill="#93a4b8" font-size="10">everything: the fixtures prove it (docs/PROPERTIES.md)</text>
<path d="M 432 454 L 468 454" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow-a78bfa)"/>
<rect x="900" y="396" width="384" height="116" rx="7" fill="rgba(76, 29, 149, 0.40)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="914" y="420" fill="#e6edf3" font-size="14" font-weight="600">report.json — the artifact, not a summary</text>
<text x="914" y="440" fill="#93a4b8" font-size="10">canonical JSON · sha256 over its own bytes</text>
<text x="914" y="455" fill="#93a4b8" font-size="10">claim: flow @ commit · height · TTL</text>
<text x="914" y="470" fill="#93a4b8" font-size="10">evidence root over merkle-ordered leaves</text>
<text x="914" y="485" fill="#93a4b8" font-size="10">merchant side simulated (stated, never implied)</text>
<path d="M 864 454 L 900 454" fill="none" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#arrow-a78bfa)"/>
<rect x="36" y="574" width="396" height="106" rx="7" fill="rgba(136, 19, 55, 0.40)" stroke="#fb7185" stroke-width="1.5"/>
<text x="50" y="598" fill="#e6edf3" font-size="14" font-weight="600">verify — a second implementation</text>
<text x="50" y="618" fill="#93a4b8" font-size="10">zanary-report verify --node &lt;node&gt;</text>
<text x="50" y="633" fill="#93a4b8" font-size="10">re-derives every evidence line from the chain:</text>
<text x="50" y="648" fill="#93a4b8" font-size="10">tx exists · receiver decrypts · memo decrypts ·</text>
<text x="50" y="663" fill="#93a4b8" font-size="10">pool totals match getblock</text>
<rect x="468" y="574" width="396" height="106" rx="7" fill="rgba(136, 19, 55, 0.40)" stroke="#fb7185" stroke-width="1.5"/>
<text x="482" y="598" fill="#e6edf3" font-size="14" font-weight="600">anchor — a timestamp nobody is trusted for</text>
<text x="482" y="618" fill="#93a4b8" font-size="10">evidence root + report hash in a shielded memo</text>
<text x="482" y="633" fill="#93a4b8" font-size="10">to a public beacon anyone may scan</text>
<text x="482" y="648" fill="#93a4b8" font-size="10">verify-anchor finds the EARLIEST anchor for that root</text>
<text x="482" y="663" fill="#93a4b8" font-size="10">flip a byte and every verifier exits 1</text>
<path d="M 1092 512 L 1092 540 L 234 540 L 234 570" fill="none" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrow-fb7185)"/>
<text x="650" y="534" fill="#8fa0b4" font-size="10" text-anchor="middle">the report is the input to both: nothing about a claim travels by trust</text>
<path d="M 1092 512 L 1092 556 L 666 556 L 666 570" fill="none" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrow-fb7185)"/>
<rect x="900" y="574" width="384" height="106" rx="7" fill="rgba(136, 19, 55, 0.40)" stroke="#fb7185" stroke-width="1.5"/>
<text x="914" y="598" fill="#e6edf3" font-size="14" font-weight="600">claim index — published, with a clock</text>
<text x="914" y="618" fill="#93a4b8" font-size="10">live → stale → dead, unless re-proved</text>
<text x="914" y="633" fill="#93a4b8" font-size="10">the claims are served next to the page</text>
<text x="914" y="648" fill="#93a4b8" font-size="10">memeshee.github.io/zanary</text>
<text x="914" y="663" fill="#93a4b8" font-size="10">the weekly CI run is the re-probe</text>
<path d="M 864 627 L 900 627" fill="none" stroke="#fb7185" stroke-width="1.4" marker-end="url(#arrow-fb7185)"/>
<rect x="36" y="706" width="1248" height="158" rx="12" fill="none" stroke="#fb923c" stroke-width="1.2" stroke-dasharray="8,5"/>
<text x="48" y="698" fill="#fb923c" font-size="11" letter-spacing="0.08em">EVERY PUSH — GITHUB ACTIONS</text>
<rect x="52" y="726" width="288" height="118" rx="7" fill="rgba(251, 146, 60, 0.20)" stroke="#fb923c" stroke-width="1.5"/>
<text x="66" y="750" fill="#e6edf3" font-size="13" font-weight="600">1 · private flow</text>
<text x="66" y="770" fill="#93a4b8" font-size="10">must PASS (12 pass · 0 fail)</text>
<text x="66" y="785" fill="#93a4b8" font-size="10">anchored at the run&#x27;s height</text>
<text x="66" y="800" fill="#93a4b8" font-size="10">a leak fails this build</text>
<rect x="356" y="726" width="288" height="118" rx="7" fill="rgba(251, 146, 60, 0.20)" stroke="#fb923c" stroke-width="1.5"/>
<text x="370" y="750" fill="#e6edf3" font-size="13" font-weight="600">2 · control flow</text>
<text x="370" y="770" fill="#93a4b8" font-size="10">must be CAUGHT</text>
<text x="370" y="785" fill="#93a4b8" font-size="10">four planted leaks, by name</text>
<text x="370" y="800" fill="#93a4b8" font-size="10">a detector gone quiet fails too</text>
<rect x="660" y="726" width="288" height="118" rx="7" fill="rgba(251, 146, 60, 0.20)" stroke="#fb923c" stroke-width="1.5"/>
<text x="674" y="750" fill="#e6edf3" font-size="13" font-weight="600">3 · bounded payer</text>
<text x="674" y="770" fill="#93a4b8" font-size="10">the ledger must show the refusals</text>
<text x="674" y="785" fill="#93a4b8" font-size="10">over-cap · off-allowlist · revoked</text>
<text x="674" y="800" fill="#93a4b8" font-size="10">one rule named per refusal</text>
<rect x="964" y="726" width="304" height="118" rx="7" fill="rgba(251, 146, 60, 0.20)" stroke="#fb923c" stroke-width="1.5"/>
<text x="978" y="750" fill="#e6edf3" font-size="13" font-weight="600">4 · publish</text>
<text x="978" y="770" fill="#93a4b8" font-size="10">index rendered + deployed</text>
<text x="978" y="785" fill="#93a4b8" font-size="10">evidence uploaded as artifacts</text>
<text x="978" y="800" fill="#93a4b8" font-size="10">weekly schedule = re-probe</text>
<rect x="36" y="886" width="12" height="12" rx="3" fill="rgba(30, 41, 59, 0.50)" stroke="#94a3b8" stroke-width="1.4"/>
<text x="54" y="896" fill="#8fa0b4" font-size="11">outside the rig</text>
<rect x="181.0" y="886" width="12" height="12" rx="3" fill="rgba(6, 78, 59, 0.40)" stroke="#34d399" stroke-width="1.4"/>
<text x="199.0" y="896" fill="#8fa0b4" font-size="11">subject under test</text>
<rect x="345.8" y="886" width="12" height="12" rx="3" fill="rgba(8, 51, 68, 0.40)" stroke="#22d3ee" stroke-width="1.4"/>
<text x="363.8" y="896" fill="#8fa0b4" font-size="11">our wallet code</text>
<rect x="490.8" y="886" width="12" height="12" rx="3" fill="rgba(120, 53, 15, 0.30)" stroke="#fbbf24" stroke-width="1.4"/>
<text x="508.8" y="896" fill="#8fa0b4" font-size="11">throwaway chain</text>
<rect x="635.8" y="886" width="12" height="12" rx="3" fill="rgba(76, 29, 149, 0.40)" stroke="#a78bfa" stroke-width="1.4"/>
<text x="653.8" y="896" fill="#8fa0b4" font-size="11">evidence + properties</text>
<rect x="820.4" y="886" width="12" height="12" rx="3" fill="rgba(136, 19, 55, 0.40)" stroke="#fb7185" stroke-width="1.4"/>
<text x="838.4" y="896" fill="#8fa0b4" font-size="11">claims a judge can check</text>
<rect x="1024.8" y="886" width="12" height="12" rx="3" fill="rgba(251, 146, 60, 0.20)" stroke="#fb923c" stroke-width="1.4"/>
<text x="1042.8" y="896" fill="#8fa0b4" font-size="11">CI, every push</text>
<text x="36" y="928" fill="#8fa0b4" font-size="11">regtest only — no mainnet, no real funds · every number in the reports is re-derivable on a judge's machine with the node and nothing from us · a claim that is not re-proved goes stale, then dead</text>
</g>
</svg>
